version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis.*"
      testing:
        patterns:
          - "xunit*"
          - "AwesomeAssertions"
          - "NSubstitute"
          - "FsCheck*"
          - "AutoFixture*"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
          - "Testcontainers.*"
      benchmarks:
        patterns:
          - "BenchmarkDotNet*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
